name: Mirror to Bitbucket

on:
  push:
    branches:
      - '**'
  delete:
    branches:
      - '**'

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for proper mirroring

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BITBUCKET_SSH_KEY }}" > ~/.ssh/id_bitbucket
          chmod 600 ~/.ssh/id_bitbucket
          ssh-keyscan -H bitbucket.org >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Mirror to Bitbucket
        env:
          GIT_SSH_COMMAND: "ssh -i ~/.ssh/id_bitbucket -o StrictHostKeyChecking=no"
        run: |
          git remote add bitbucket git@bitbucket.org:iccgit/unicc-hireflow.git
          git push --mirror bitbucket
